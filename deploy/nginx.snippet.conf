# ===== Quizpile 安全规则：粘贴到站点 server { } 内部即可 =====
# 建议位置：写在 access_log / error_log 下面（宝塔面板的最末尾也可以）

location ^~ /lib/     { deny all; }
location ^~ /tools/   { deny all; }
location ^~ /tests/   { deny all; }

location ^~ /uploads/ {
    location ~ \.(php|php3|php4|php5|php7|pht|phtml|pl|py|cgi|sh)$ { deny all; }
    autoindex off;
}
# ===== 结束 =====
#
# 说明：
# 1) 不要加 `location ~ /\. { deny all; }` —— 它会误伤所有带点的静态资源
#    （webp / svg / ico 等图片会全部 403），宝塔自带的敏感文件规则已经够用。
# 2) uploads 规则在 Nginx 下必加（项目里的 uploads/.htaccess 只对 Apache 生效）。
# 3) 如果部署在子目录（如 /quizvault/），所有路径都要加前缀。
